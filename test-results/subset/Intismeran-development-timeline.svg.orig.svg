<title>Clinical development timeline of intismeran autogene (mRNA-4157/V940)</title>
<desc>Gantt chart of the 12 registered clinical trials of intismeran autogene, an individualized neoantigen therapy developed by Moderna and Merck. Each bar runs from the trial's start date to its primary completion date, shaded by trial phase. Programme milestones from 2017 to 2026 are marked along the time axis. Data from ClinicalTrials.gov via the AACT database, as of 19 August 2026.</desc>
