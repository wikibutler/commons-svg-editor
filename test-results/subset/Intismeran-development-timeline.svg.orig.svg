<text x="14" y="56" font-size="12.5" fill="#52514e">All 12 registered trials. Each bar spans the trial's start date to its primary completion date; shading indicates phase.</text>
<text x="14" y="74" font-size="12.5" fill="#52514e">Dates after August 2026 are sponsor estimates and are routinely revised.</text>
